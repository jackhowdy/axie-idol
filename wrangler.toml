name = "axie-idol"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# The game lives at axieidol.com; the workers.dev address keeps working as a fallback.
routes = [
  { pattern = "axieidol.com", custom_domain = true },
  { pattern = "www.axieidol.com", custom_domain = true },
]


[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]

[vars]
SEED_POSTS = "0"
# 1-in-N chance a post contains the Golden Axie (set to "1" for a demo day)
GOLDEN_ODDS = "5000"
BUDDY = "1"

[[durable_objects.bindings]]
name = "STORE"
class_name = "IdolStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IdolStore"]

# R2 for photos — re-enable once the API token has "Workers R2 Storage: Edit" and the bucket exists.
# Until then photos are chunked into the Durable Object (worker/store.mjs putBlob).
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "axie-idol-uploads"
