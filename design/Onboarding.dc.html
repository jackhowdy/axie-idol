<div style="position: relative; width: 375px; height: 812px; overflow: hidden; background: linear-gradient(180deg, #E8F6FF 0%, #E8F6FF 55%, #DFF5C8 100%); display: flex; flex-direction: column; box-sizing: border-box;">
  <svg style="position: absolute; left: 0; top: 380px; width: 375px; height: 200px;" viewBox="0 0 375 200" fill="none">

  <div style="position: relative; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(26,43,60,0.10);">

    </div>
