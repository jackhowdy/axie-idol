<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1A2B3C; }
    a { color: #2B8CEE; } a:hover { color: #1f6fc2; }
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 812px; overflow: hidden; background: #E8F6FF; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 56px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="font-size: 24px; font-weight: 900;">Feed</div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C5D6E5;">
      <div style="width: 26px; height: 26px; border-radius: 999px; background: #DFF5C8; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A2B3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
      <div style="font-size: 13px; font-weight: 800;">Guest-7F2A · Lv 1</div>
    </div>
  </div>

  <div style="margin: 0 16px 12px; padding: 12px 14px; border-radius: 16px; background: #DFF5C8; display: flex; align-items: center; gap: 12px;">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden;"><img src="bing.png" alt="Bing" style="width: 40px; height: 40px; object-fit: cover;"></div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
      <div style="font-size: 13px; font-weight: 800;">Next: leave 1 comment</div>
      <div style="height: 6px; border-radius: 999px; background: rgba(26,43,60,0.12); overflow: hidden;"><div style="width: 0%; height: 6px; background: #2B8CEE;"></div></div>
      <div style="font-size: 12px; font-weight: 700; color: #5A6F82;">0 / 1 · unlocks Kotaro's sword</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A2B3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </div>

  <div style="margin: 0 16px 10px; display: flex; gap: 8px;">
    <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #1A2B3C; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center;">Everyone</div>
    <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C5D6E5; font-size: 13px; font-weight: 800; display: flex; align-items: center;">Following</div>
    <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C5D6E5; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px;"><img src="kotaro.png" alt="" style="width: 20px; height: 20px; border-radius: 999px; object-fit: cover;">Kotaro</div>
  </div>

  <div style="flex: 1 1 auto; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(26,43,60,0.12); overflow: hidden; display: flex; flex-direction: column;">
      <div style="position: relative; height: 236px; background: linear-gradient(180deg, #BFE1FF 0%, #E8F6FF 45%, #CDEFB0 46%, #BFE79E 100%);">
        <img src="kotaro_sticker.png" alt="Kotaro on a hill" style="position: absolute; left: 106px; top: 36px; width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(26,43,60,0.25));">
        <div style="position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border-radius: 999px; background: rgba(255,255,255,0.92);">
          <img src="kotaro.png" alt="" style="width: 26px; height: 26px; border-radius: 999px; object-fit: cover;">
          <div style="font-size: 13px; font-weight: 900;">Kotaro</div>
          <div style="height: 20px; padding: 0 8px; border-radius: 999px; background: #1A2B3C; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center;">Cast</div>
        </div>
        <div style="position: absolute; right: 12px; top: 12px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.92); font-size: 12px; font-weight: 800; color: #5A6F82; display: flex; align-items: center;">by Guest-7F2A</div>
      </div>
      <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.4;">Hill day. Kotaro insisted on guarding the picnic.</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C5D6E5; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>12</div>
          <div style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C5D6E5; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A2B3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>3</div>
          <div style="flex: 1 1 auto;"></div>
          <div style="height: 40px; padding: 0 12px; border-radius: 999px; background: rgba(43,140,238,0.12); border: 1px solid rgba(43,140,238,0.45); color: #2B8CEE; font-size: 13px; font-weight: 800; display: flex; align-items: center;">Follow Kotaro</div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 12px; background: #E8F6FF;">
          <img src="bing.png" alt="" style="width: 24px; height: 24px; border-radius: 999px; object-fit: cover; flex: 0 0 auto;">
          <div style="font-size: 13px; font-weight: 600; line-height: 1.4;"><span style="font-weight: 900;">Bing</span> <span style="font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: #1A2B3C; color: #fff;">Cast</span> Loud and proud: I'm following you now.</div>
        </div>
      </div>
    </div>

    <div style="border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(26,43,60,0.12); overflow: hidden; display: flex; flex-direction: column;">
      <div style="position: relative; height: 120px; background: linear-gradient(180deg, #FFE9DD 0%, #E8F6FF 100%);">
        <img src="buba.png" alt="Buba" style="position: absolute; left: 130px; top: 6px; width: 110px; height: 110px; object-fit: contain;">
        <div style="position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border-radius: 999px; background: rgba(255,255,255,0.92);">
          <img src="buba.png" alt="" style="width: 26px; height: 26px; border-radius: 999px; object-fit: cover;">
          <div style="font-size: 13px; font-weight: 900;">Durendal #4154</div>
          <div style="height: 20px; padding: 0 8px; border-radius: 999px; background: #3ECF8E; color: #0e3d2a; font-size: 11px; font-weight: 800; display: flex; align-items: center;">Owned</div>
        </div>
      </div>
    </div>
  </div>

  <div style="position: relative; height: 84px; background: #FFFFFF; border-top: 1px solid #C5D6E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2B8CEE;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><div style="font-size: 11px; font-weight: 800;">Feed</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;"><div style="width: 56px; height: 56px; margin-top: -26px; border-radius: 999px; background: #FF6B2C; border: 4px solid #FFFFFF; box-shadow: 0 6px 18px rgba(255,107,44,0.35); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div><div style="font-size: 11px; font-weight: 800; color: #FF6B2C;">Snap</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5A6F82;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 6h3a2 2 0 0 1-2 4M7 6H4a2 2 0 0 0 2 4"></path></svg><div style="font-size: 11px; font-weight: 800;">Ladder</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5A6F82;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><div style="font-size: 11px; font-weight: 800;">Crew</div></div>
  </div>
</div>
</x-dc>
</body>
</html>
