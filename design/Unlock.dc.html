<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1A2B3C; }
    a { color: #2B8CEE; } a:hover { color: #1f6fc2; }
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 812px; overflow: hidden; background: #E8F6FF; display: flex; flex-direction: column; box-sizing: border-box;">
  <div style="position: absolute; inset: 0; background: #E8F6FF; opacity: 0.6;"></div>
  <div style="position: absolute; left: 16px; top: 56px; right: 16px; height: 300px; border-radius: 16px; background: #FFFFFF; opacity: 0.5;"></div>
  <div style="position: absolute; inset: 0; background: rgba(26,43,60,0.42);"></div>

  <div style="position: absolute; left: 62px; top: 150px; width: 10px; height: 10px; border-radius: 2px; background: #FFD23F; transform: rotate(20deg);"></div>
  <div style="position: absolute; left: 120px; top: 120px; width: 8px; height: 14px; border-radius: 2px; background: #FF6B2C; transform: rotate(-30deg);"></div>
  <div style="position: absolute; left: 210px; top: 110px; width: 10px; height: 10px; border-radius: 999px; background: #3ECF8E;"></div>
  <div style="position: absolute; left: 290px; top: 140px; width: 12px; height: 8px; border-radius: 2px; background: #2B8CEE; transform: rotate(35deg);"></div>
  <div style="position: absolute; left: 330px; top: 200px; width: 8px; height: 12px; border-radius: 2px; background: #FFD23F; transform: rotate(-15deg);"></div>
  <div style="position: absolute; left: 40px; top: 230px; width: 10px; height: 10px; border-radius: 999px; background: #FF6B2C;"></div>
  <div style="position: absolute; left: 300px; top: 560px; width: 10px; height: 14px; border-radius: 2px; background: #3ECF8E; transform: rotate(50deg);"></div>
  <div style="position: absolute; left: 70px; top: 600px; width: 12px; height: 8px; border-radius: 2px; background: #2B8CEE; transform: rotate(-40deg);"></div>

  <div style="position: relative; margin: auto 24px; padding: 28px 22px 22px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(26,43,60,0.30); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <div style="height: 26px; padding: 0 12px; border-radius: 999px; background: #DFF5C8; font-size: 12px; font-weight: 900; letter-spacing: 0.06em; display: flex; align-items: center;">LEVEL 1 REACHED</div>
    <div style="position: relative; width: 168px; height: 168px;">
      <div style="position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(180deg, #CFE9FF 0%, #DFF5C8 100%);"></div>
      <img src="bing.png" alt="Bing" style="position: absolute; inset: 8px; width: 152px; height: 152px; border-radius: 999px; object-fit: cover; border: 4px solid #FFFFFF;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 26px; font-weight: 900; line-height: 1.1;">Bing joined your crew</div>
      <div style="font-size: 15px; font-weight: 600; line-height: 1.45; color: #5A6F82;">Bing follows you now and will show up in your comments. Take Bing out for a photo whenever you like.</div>
    </div>
    <div style="width: 100%; padding: 10px 12px; border-radius: 12px; background: #E8F6FF; display: flex; align-items: center; gap: 10px; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B8CEE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-9 9H5v-6z"></path><path d="M12 6l6 6"></path></svg>
      <div style="font-size: 13px; font-weight: 700; line-height: 1.35;"><span style="font-weight: 900;">Next up:</span> leave 1 comment to unlock Kotaro's sword</div>
    </div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 52px; border-radius: 999px; background: #2B8CEE; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(26,43,60,0.12);">Snap with Bing</div>
      <div style="height: 44px; border-radius: 999px; font-weight: 800; font-size: 14px; color: #5A6F82; display: flex; align-items: center; justify-content: center;">Back to the feed</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
